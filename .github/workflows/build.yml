name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: ./build.sh "$RUNNER_TEMP/NXNative.app"
      - name: Package
        run: ditto -c -k --keepParent "$RUNNER_TEMP/NXNative.app" "$RUNNER_TEMP/NXNative-Hub.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NXNative-Hub
          path: ${{ runner.temp }}/NXNative-Hub.zip
